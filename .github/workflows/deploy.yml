name: Big Starz Deploy Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bigstarz

jobs:
  # ───────────────────────────────────────────────────────────
  # Lint
  # ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
            ai/package-lock.json

      - name: Lint Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint

      - name: Lint Web
        working-directory: web
        run: |
          npm ci
          npm run lint

  # ───────────────────────────────────────────────────────────
  # Test
  # ───────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bigstarz
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: bigstarz_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Test Backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://bigstarz:testpass@localhost:5432/bigstarz_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          REDIS_URL: redis://localhost:6379
        run: |
          npm ci
          npx prisma migrate deploy
          npm run test

      - name: Test Web (Build Check)
        working-directory: web
        run: |
          npm ci
          npm run build

  # ───────────────────────────────────────────────────────────
  # Build Docker Images
  # ───────────────────────────────────────────────────────────
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push AI Worker
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./deployment/docker/nginx
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nginx:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────
  # Deploy to Staging (on merge to develop)
  # ───────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig (staging)
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Staging
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig
          sed -i 's|image: big-starz/|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/|g' deployment/k8s/*.yaml
          sed -i 's|:latest|:${{ github.sha }}|g' deployment/k8s/*.yaml
          kubectl apply -f deployment/k8s/namespace.yaml
          kubectl apply -f deployment/k8s/configmap.yaml
          kubectl apply -f deployment/k8s/secret.yaml
          kubectl apply -f deployment/k8s/pvc-uploads.yaml
          kubectl apply -f deployment/k8s/postgres-deployment.yaml
          kubectl apply -f deployment/k8s/postgres-service.yaml
          kubectl apply -f deployment/k8s/redis-deployment.yaml
          kubectl apply -f deployment/k8s/redis-service.yaml
          kubectl apply -f deployment/k8s/backend-deployment.yaml
          kubectl apply -f deployment/k8s/backend-service.yaml
          kubectl apply -f deployment/k8s/backend-hpa.yaml
          kubectl apply -f deployment/k8s/web-deployment.yaml
          kubectl apply -f deployment/k8s/web-service.yaml
          kubectl apply -f deployment/k8s/ai-worker-deployment.yaml
          kubectl apply -f deployment/k8s/ingress.yaml
          kubectl rollout status deployment/backend -n big-starz --timeout=300s
          kubectl rollout status deployment/web -n big-starz --timeout=300s

  # ───────────────────────────────────────────────────────────
  # Deploy to Production (on merge to main — manual approval)
  # ───────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig (production)
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Production
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig
          sed -i 's|image: big-starz/|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/|g' deployment/k8s/*.yaml
          sed -i 's|:latest|:${{ github.sha }}|g' deployment/k8s/*.yaml
          kubectl apply -f deployment/k8s/namespace.yaml
          kubectl apply -f deployment/k8s/configmap.yaml
          kubectl apply -f deployment/k8s/secret.yaml
          kubectl apply -f deployment/k8s/pvc-uploads.yaml
          kubectl apply -f deployment/k8s/postgres-deployment.yaml
          kubectl apply -f deployment/k8s/postgres-service.yaml
          kubectl apply -f deployment/k8s/redis-deployment.yaml
          kubectl apply -f deployment/k8s/redis-service.yaml
          kubectl apply -f deployment/k8s/backend-deployment.yaml
          kubectl apply -f deployment/k8s/backend-service.yaml
          kubectl apply -f deployment/k8s/backend-hpa.yaml
          kubectl apply -f deployment/k8s/web-deployment.yaml
          kubectl apply -f deployment/k8s/web-service.yaml
          kubectl apply -f deployment/k8s/ai-worker-deployment.yaml
          kubectl apply -f deployment/k8s/ingress.yaml
          kubectl rollout status deployment/backend -n big-starz --timeout=300s
          kubectl rollout status deployment/web -n big-starz --timeout=300s
