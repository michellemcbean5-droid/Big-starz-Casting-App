apiVersion: v1
kind: Secret
metadata:
  name: big-starz-secrets
  namespace: big-starz
type: Opaque
stringData:
  # ═══════════════════════════════════════════════════════════
  # SECRET VALUES — Fill in before deploying to production
  # NEVER commit this file with real values. Use Sealed Secrets or external vault.
  # ═══════════════════════════════════════════════════════════

  # Database
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  DATABASE_URL: "postgresql://bigstarz:CHANGE_ME_DB_PASSWORD@postgres:5432/bigstarz"

  # JWT (generate with: openssl rand -base64 64)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_JWT_REFRESH_SECRET"

  # HuggingFace
  HUGGINGFACE_API_TOKEN: "hf_CHANGE_ME"

  # Stripe (live keys)
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"

  # S3 / Object Storage
  S3_BUCKET: "bigstarz-uploads"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY: "AKIA_CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME_S3_SECRET"
