version: "3.8"

services:
  # ───────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bigstarz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bigstarz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-bigstarz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bigstarz} -d ${DB_NAME:-bigstarz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigstarz-network

  # ───────────────────────────────────────────────────────────
  # Redis Cache & Queue
  # ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bigstarz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigstarz-network

  # ───────────────────────────────────────────────────────────
  # Backend API
  # ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bigstarz-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-bigstarz}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-bigstarz}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: redis://redis:6379
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN}
      HF_MODEL_TEXT: ${HF_MODEL_TEXT:-mistralai/Mistral-7B-Instruct-v0.2}
      HF_MODEL_IMAGE: ${HF_MODEL_IMAGE:-stabilityai/stable-diffusion-xl-base-1.0}
      HF_MODEL_VIDEO: ${HF_MODEL_VIDEO:-stabilityai/stable-video-diffusion-img2vid-xt}
      HF_MODEL_STT: ${HF_MODEL_STT:-openai/whisper-large-v3}
      HF_MODEL_TTS: ${HF_MODEL_TTS:-microsoft/speecht5_tts}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      API_URL: ${API_URL:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bigstarz-network

  # ───────────────────────────────────────────────────────────
  # Web App (Next.js)
  # ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bigstarz-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bigstarz-network

  # ───────────────────────────────────────────────────────────
  # AI Worker (Background Job Processor)
  # ───────────────────────────────────────────────────────────
  ai-worker:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: bigstarz-ai-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN}
      HF_MODEL_TEXT: ${HF_MODEL_TEXT:-mistralai/Mistral-7B-Instruct-v0.2}
      HF_MODEL_IMAGE: ${HF_MODEL_IMAGE:-stabilityai/stable-diffusion-xl-base-1.0}
      HF_MODEL_VIDEO: ${HF_MODEL_VIDEO:-stabilityai/stable-video-diffusion-img2vid-xt}
      HF_MODEL_STT: ${HF_MODEL_STT:-openai/whisper-large-v3}
      HF_MODEL_TTS: ${HF_MODEL_TTS:-microsoft/speecht5_tts}
      API_URL: ${API_URL:-http://backend:3001}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - bigstarz-network

  # ───────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ───────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./deployment/docker/nginx
      dockerfile: Dockerfile
    container_name: bigstarz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - uploads:/var/www/uploads:ro
    networks:
      - bigstarz-network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  bigstarz-network:
    driver: bridge
